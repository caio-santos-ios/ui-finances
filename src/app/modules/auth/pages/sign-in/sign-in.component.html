<form class="my-10 space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="text-center">
    <p class="text-muted-foreground text-sm">Insira suas credenciais para acessar sua conta.</p>
  </div>

  <div class="space-y-3 text-left">
    <div class="form__group">
      <div class="relative">
        <input type="text" id="email" class="peer block" placeholder=" " formControlName="email" />
        <label for="email"
          class="bg-background text-muted-foreground peer-focus:text-primary absolute top-2 z-10 origin-left -translate-y-4 scale-95 transform px-2 text-sm duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 ltr:left-1 rtl:right-1">
          E-mail
        </label>
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <input [type]="passwordTextType ? 'text' : 'password'" id="password" class="peer block" placeholder=" "
          formControlName="password" />
        <label for="password"
          class="bg-background text-muted-foreground peer-focus:text-primary absolute top-2 z-10 origin-left -translate-y-4 scale-95 transform px-2 text-sm duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 ltr:left-1 rtl:right-1">
          Senha
        </label>
        <span class="text-muted-foreground absolute top-2 cursor-pointer ltr:right-3 rtl:left-3"
          (click)="togglePasswordTextType()">
          <svg-icon [src]="
              !passwordTextType
                ? 'assets/icons/heroicons/outline/eye-off.svg'
                : 'assets/icons/heroicons/outline/eye.svg'
            " [svgClass]="'h-5 w-5'">
          </svg-icon>
        </span>
      </div>
    </div>
  </div>

  <div class="mb-2 flex items-center justify-between space-x-3">
    <div class="flex items-center">
      <input id="remember-me" name="remember-me" type="checkbox" formControlName="rememberMe" />
      <label for="remember-me" class="text-muted-foreground ml-2 block text-sm"> Lembre de mim </label>
    </div>

    <app-button [type]="'button'" routerLink="/auth/forgot-password" impact="none" tone="primary" shape="rounded" size="small">
      Esqueceu sua senha?
    </app-button>
  </div>
  
  <div>
    <app-button [disabled]="submitted" [isLoading]="submitted" full impact="bold" tone="primary" shape="rounded"
      size="medium">Entrar</app-button>
  </div>
  
  <div class="text-muted-foreground flex items-center text-sm gap-2">
    <span>Ainda não tem conta?</span>
    <app-button [type]="'button'" routerLink="/auth/sign-up" impact="none" tone="primary" shape="rounded" size="small">
      Cadastre-se
    </app-button>
  </div>
</form>
