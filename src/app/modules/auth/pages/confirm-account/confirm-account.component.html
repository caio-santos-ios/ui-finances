<form class="my-10 space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="text-center">
    <h2 class="text-foreground mb-1 text-3xl font-semibold">Confirmar Conta</h2>
    <p class="text-muted-foreground text-sm">
      Insira o código que você recebeu por e-mail para ativar sua conta.
    </p>
  </div>

  <div class="space-y-3 text-left">
    <div class="relative">
      <input type="text" id="code" class="peer block" placeholder=" " formControlName="code"/>
      <label
        for="code"
        class="bg-background text-muted-foreground peer-focus:text-primary absolute top-2 z-10 origin-left -translate-y-4 scale-95 transform px-2 text-sm duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 ltr:left-1 rtl:right-1">
        Código de Confirmação
      </label>
    </div>

    <div class="relative">
      <input type="email" id="email" class="peer block" placeholder=" " formControlName="email"/>
      <label
        for="email"
        class="bg-background text-muted-foreground peer-focus:text-primary absolute top-2 z-10 origin-left -translate-y-4 scale-95 transform px-2 text-sm duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 ltr:left-1 rtl:right-1">
        E-mail (opcional)
      </label>
    </div>
  </div>

  <div class="flex items-center justify-between text-xs">
    <span class="text-muted-foreground">Não recebeu o código?</span>
    <button
      type="button"
      (click)="resendCode()"
      [disabled]="resending"
      class="text-primary hover:underline cursor-pointer font-medium disabled:opacity-50">
      {{ resending ? 'Reenviando...' : 'Reenviar código' }}
    </button>
  </div>

  <div>
    <app-button [disabled]="submitted" [isLoading]="submitted" full impact="bold" tone="primary" shape="rounded" size="medium">
      Confirmar Conta
    </app-button>
  </div>

  <div class="text-center text-sm">
    <a class="text-muted-foreground hover:text-primary cursor-pointer" routerLink="/auth/sign-in">
      Voltar para o login
    </a>
  </div>
</form>
