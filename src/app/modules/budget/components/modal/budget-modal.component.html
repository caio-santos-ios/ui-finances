<div class="border-muted/20 bg-card w-[480px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid {{isEdit ? 'fa-pen-to-square' : 'fa-plus'}} text-primary text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">{{isEdit ? 'Editar Orçamento' : 'Novo Orçamento'}}</h2>
    </div>
    <button type="button" (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <form [formGroup]="form">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="name">Nome</label>
        <input id="name" type="text" placeholder="Nome" formControlName="name"
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="limit">Limite</label>
        <input id="limit" type="text" placeholder="R$ 0,00" formControlName="limit" mask="separator.2"
          thousandSeparator="." decimalMarker="," prefix="R$ "
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="category">Categoria</label>
        <select id="category" formControlName="categoryId"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="">Selecione</option>
          @for (item of categories; track $index) {
          <option value="{{item.id}}">{{item.name}}</option>
          }
        </select>
      </div>
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="alertPercentage">% de Alerta</label>
        <input id="alertPercentage" type="text" inputmode="numeric" placeholder="0%" formControlName="alertPercentage"
          mask="percent" suffix="%"
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="receiveAlert">Receber alerta</label>
        <label for="receiveAlert" class="flex cursor-pointer items-center justify-between gap-3">
          <span class="relative inline-flex shrink-0">
            <input id="receiveAlert" type="checkbox" role="switch" formControlName="receiveAlert"
              class="peer sr-only" />
            <span
              class="h-[1.8rem] w-11 rounded-full bg-slate-300 transition-colors dark:bg-slate-600 peer-checked:bg-primary peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2"></span>
            <span
              class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-4"></span>
          </span>
        </label>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <app-button (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>

      @if (isEdit) {
      <app-button (buttonClick)="update()" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar Alterações
      </app-button>
      } @else {
      <app-button (buttonClick)="create()" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar
      </app-button>
      }
    </div>
  </form>
</div>
