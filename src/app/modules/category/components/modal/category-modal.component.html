<div class="border-muted/20 bg-card w-[480px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid {{isEdit ? 'fa-pen-to-square' : 'fa-plus'}} text-primary text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">{{isEdit ? 'Editar Categoria' : 'Nova Categoria'}}</h2>
    </div>
    <button
      type="button"
      (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <form [formGroup]="form">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="name">Nome</label>
        <input
          id="name"
          type="text"
          placeholder="Ex: Alimentação, Salário..."
          formControlName="name"
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="type">Tipo</label>
        <select
          id="type"
          formControlName="type"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="income">Receita</option>
          <option value="expense">Despesa</option>
        </select>
      </div>

      @if (form.get('type')?.value === 'expense') {
        <div class="col-span-12 sm:col-span-6">
          <label class="text-foreground mb-1.5 block text-xs font-semibold" for="lifeCostClass">Custo de Vida</label>
          <select
            id="lifeCostClass"
            formControlName="lifeCostClass"
            class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
            <option value="ESSENTIAL">Essencial</option>
            <option value="DISCRETIONARY">Discricionário</option>
            <option value="EXCLUDED">Excluído do Custo</option>
          </select>
        </div>

        <div class="col-span-12 sm:col-span-6">
          <label class="text-foreground mb-1.5 block text-xs font-semibold" for="lifeCostRecurrence">Recorrência</label>
          <select
            id="lifeCostRecurrence"
            formControlName="lifeCostRecurrence"
            class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
            <option value="FIXED">Fixo</option>
            <option value="VARIABLE">Variável</option>
          </select>
        </div>
      }

      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="irTreatment">Tratamento no Imposto de Renda</label>
        <select
          id="irTreatment"
          formControlName="irTreatment"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="NONE">Não entra na declaração</option>
          <option value="TAXABLE_INCOME">Rendimento Tributável (Salários, Aluguéis, etc.)</option>
          <option value="EXEMPT_INCOME">Rendimento Isento (Bolsas, Doações, etc.)</option>
          <option value="EXCLUSIVE_INCOME">Tributação Exclusiva (PLR, etc.)</option>
          <option value="DEDUCTION">Dedução Legal (Saúde, Educação, Previdência)</option>
        </select>
      </div>

      @if (form.get('irTreatment')?.value === 'DEDUCTION') {
        <div class="col-span-12">
          <label class="text-foreground mb-1.5 block text-xs font-semibold" for="irSubtype">Tipo de Dedução</label>
          <select
            id="irSubtype"
            formControlName="irSubtype"
            class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
            <option value="health">Despesas Médicas / Saúde</option>
            <option value="education">Instrução / Educação</option>
            <option value="pension">Previdência Privada (PGBL)</option>
            <option value="dependent">Dependentes</option>
            <option value="alimony">Pensão Alimentícia</option>
            <option value="other">Outra Dedução</option>
          </select>
        </div>
      }
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <app-button (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>

      @if (isEdit) {
      <app-button (buttonClick)="update()" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar Alterações
      </app-button>
      } @else {
      <app-button (buttonClick)="create()" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar
      </app-button>
      }
    </div>
  </form>
</div>
