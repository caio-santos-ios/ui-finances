<div class="border-muted/20 bg-card w-[520px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid {{ isEdit ? 'fa-pen-to-square' : 'fa-plus' }} text-primary text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">{{ isEdit ? 'Editar Ativo' : 'Novo Ativo' }}</h2>
    </div>
    <button type="button" (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <form [formGroup]="form">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-12 sm:col-span-5">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="type">Tipo de Ativo</label>
        <select id="type" formControlName="type"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="STOCK">Ação (B3)</option>
          <option value="REIT">Fundo Imobiliário (FII)</option>
          <option value="ETF">ETF</option>
          <option value="FIXED_INCOME">Renda Fixa</option>
          <option value="CRYPTO">Criptomoeda</option>
          <option value="OTHER">Outro</option>
        </select>
      </div>

      <div class="col-span-12 sm:col-span-7">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="ticker">Código / Ticker</label>
        <input id="ticker" type="text" placeholder="Ex: PETR4, HGLG11, BTC..." formControlName="ticker"
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none uppercase transition" />
      </div>

      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="name">Nome do Ativo / Descrição</label>
        <input id="name" type="text" placeholder="Ex: Petrobras PN, CSHG Logística, CDB Banco Inter..." formControlName="name"
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="manualPrice">Preço Atual / Manual (R$)</label>
        <input id="manualPrice" type="text" mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
          placeholder="R$ 0,00" formControlName="manualPrice"
          class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      @if (form.get('type')?.value === 'FIXED_INCOME') {
        <div class="col-span-12 sm:col-span-6">
          <label class="text-foreground mb-1.5 block text-xs font-semibold" for="contractedRate">Taxa Contratada (% a.a.)</label>
          <input id="contractedRate" type="number" step="0.01" placeholder="Ex: 12.5" formControlName="contractedRate"
            class="border-muted/20 bg-background text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
        </div>

        <div class="col-span-12 sm:col-span-6">
          <label class="text-foreground mb-1.5 block text-xs font-semibold" for="maturityDate">Data de Vencimento</label>
          <input id="maturityDate" type="date" formControlName="maturityDate"
            class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
        </div>
      }
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <app-button (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>
      <app-button (buttonClick)="save()" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> {{ isEdit ? 'Salvar Alterações' : 'Salvar' }}
      </app-button>
    </div>
  </form>
</div>
