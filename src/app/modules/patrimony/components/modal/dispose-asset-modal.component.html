<div class="border-muted/20 bg-card w-[520px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-handshake text-primary text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">Sinalizar Desfazimento &bull; {{ asset.name }}</h2>
    </div>
    <button type="button" (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="confirmDispose()">
    <div class="space-y-4">
      <div>
        <label class="text-foreground mb-1.5 block text-xs font-semibold">Motivo do Desfazimento</label>
        <select formControlName="disposalReason"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="Venda">Venda</option>
          <option value="Doação">Doação</option>
          <option value="Troca">Troca</option>
          <option value="Sinistro / Perda">Sinistro / Perda / Roubo</option>
          <option value="Sucateamento">Sucateamento / Fim de Vida Útil</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="text-foreground mb-1.5 block text-xs font-semibold">Data do Desfazimento</label>
          <input type="date" formControlName="disposalDate"
            class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
        </div>

        <div>
          <label class="text-foreground mb-1.5 block text-xs font-semibold">Valor Obtido (R$)</label>
          <input type="text" mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
            formControlName="disposalValue" placeholder="R$ 0,00"
            class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
        </div>
      </div>

      <div class="rounded-xl border border-muted/20 bg-background/50 p-3.5 space-y-3">
        <label class="flex items-center gap-2 cursor-pointer text-xs text-foreground font-medium select-none">
          <input type="checkbox" formControlName="createIncomeOperation"
            class="rounded border-muted/30 text-primary focus:ring-primary h-4 w-4" />
          <span>Lançar valor obtido como receita na minha conta bancária</span>
        </label>

        @if (form.get('createIncomeOperation')?.value) {
          <div class="pt-1">
            <label class="text-foreground mb-1.5 block text-xs font-semibold">Conta / Banco de Destino</label>
            <select formControlName="bankId"
              class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
              <option value="">Selecione a conta...</option>
              @for (bank of banks; track bank.id) {
                <option [value]="bank.id">{{ bank.name }}</option>
              }
            </select>
          </div>
        }
      </div>

      <div>
        <label class="text-foreground mb-1.5 block text-xs font-semibold">Observações</label>
        <textarea formControlName="disposalNotes" rows="2" placeholder="Detalhes do comprador, comprovante, etc..."
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition"></textarea>
      </div>

      <p class="text-muted-foreground text-xs">
        Este bem será marcado como <strong>Desfeito</strong> e transferido para o histórico, preservando todos os lançamentos anteriores.
      </p>
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <app-button type="button" (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>
      <app-button type="submit" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Confirmar Desfazimento
      </app-button>
    </div>
  </form>
</div>
