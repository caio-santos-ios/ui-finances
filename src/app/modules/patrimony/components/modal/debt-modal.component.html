<div class="border-muted/20 bg-card w-[540px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid {{isEdit ? 'fa-pen-to-square' : 'fa-plus'}} text-primary text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">{{isEdit ? 'Editar Dívida / Financiamento' : 'Nova Dívida / Financiamento'}}</h2>
    </div>
    <button type="button" (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <form [formGroup]="form">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="name">Nome da Dívida / Financiamento *</label>
        <input id="name" type="text" formControlName="name" placeholder="Ex: Financiamento Imobiliário, Empréstimo Caixa..."
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="type">Tipo</label>
        <select id="type" formControlName="type"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="financing">Financiamento</option>
          <option value="personal_loan">Empréstimo Pessoal</option>
          <option value="credit_card">Cartão de Crédito / Parcelado</option>
          <option value="family">Dívida Familiar / Terceiros</option>
          <option value="other">Outro Passivo</option>
        </select>
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="bankId">Banco Vinculado (Débito)</label>
        <select id="bankId" formControlName="bankId"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="">Nenhum banco selecionado</option>
          @for (bank of banks; track bank.id) {
            <option [value]="bank.id">{{bank.name}}</option>
          }
        </select>
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="totalAmount">Valor Total Contratado *</label>
        <input id="totalAmount" type="text" placeholder="R$ 0,00" formControlName="totalAmount"
          mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="remainingAmount">Saldo Devedor Atual</label>
        <input id="remainingAmount" type="text" placeholder="R$ 0,00" formControlName="remainingAmount"
          mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12 sm:col-span-4">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="installmentAmount">Valor da Parcela</label>
        <input id="installmentAmount" type="text" placeholder="R$ 0,00" formControlName="installmentAmount"
          mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-6 sm:col-span-3">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="paidInstallments">Pagas</label>
        <input id="paidInstallments" type="number" formControlName="paidInstallments" min="0"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-6 sm:col-span-3">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="totalInstallments">Total Parcelas</label>
        <input id="totalInstallments" type="number" formControlName="totalInstallments" min="1"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12 sm:col-span-2">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="dueDay">Dia Venc.</label>
        <input id="dueDay" type="number" formControlName="dueDay" min="1" max="31"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>

      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="description">Observações / Detalhes</label>
        <textarea id="description" formControlName="description" rows="2" placeholder="Contrato, taxa de juros, amortização..."
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition"></textarea>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <app-button (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>

      @if (isEdit) {
      <app-button (buttonClick)="update()" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar Alterações
      </app-button>
      } @else {
      <app-button (buttonClick)="create()" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar
      </app-button>
      }
    </div>
  </form>
</div>
