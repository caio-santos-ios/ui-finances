<div class="border-muted/20 bg-background w-[650px] max-w-[95vw] rounded-2xl border p-6 shadow-2xl">
  <div class="flex items-center justify-between border-b border-border pb-4">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 text-primary">
        <i class="fa-solid fa-tags text-lg"></i>
      </div>
      <div>
        <h2 class="text-foreground text-lg font-bold">Classificação de Categorias</h2>
        <p class="text-muted-foreground text-xs">Defina quais despesas são essenciais, discricionárias ou excluídas do custo de vida</p>
      </div>
    </div>
    <button type="button" (click)="close(true)" class="text-muted-foreground hover:text-foreground h-8 w-8 rounded-lg flex items-center justify-center transition-colors">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>

  <div class="mt-4">
    @if (isLoading) {
      <div class="flex min-h-[220px] flex-col items-center justify-center text-center">
        <svg class="h-8 w-8 animate-spin text-primary" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p class="text-muted-foreground mt-3 text-xs">Carregando categorias...</p>
      </div>
    } @else {
      <div class="max-h-[420px] overflow-y-auto pr-2 divide-y divide-border/40">
        @for (item of categories; track item.id) {
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 py-3">
            <div class="flex items-center gap-2">
              <span class="font-medium text-sm text-foreground">{{ item.name }}</span>
              @if (item.isUnclassified) {
                <span class="rounded bg-amber-500/10 px-1.5 py-0.5 text-[10px] font-bold text-amber-500">Pendente</span>
              }
            </div>

            <div class="flex items-center gap-2">
              <select [(ngModel)]="item.lifeCostClass" (change)="saveClassification(item)"
                class="border-muted/20 bg-card text-foreground focus:border-primary focus:ring-primary rounded-lg border px-2.5 py-1 text-xs outline-none transition">
                <option value="ESSENTIAL">Essencial</option>
                <option value="DISCRETIONARY">Discricionário</option>
                <option value="EXCLUDED">Excluído do Custo</option>
              </select>

              <select [(ngModel)]="item.lifeCostRecurrence" (change)="saveClassification(item)"
                class="border-muted/20 bg-card text-foreground focus:border-primary focus:ring-primary rounded-lg border px-2.5 py-1 text-xs outline-none transition">
                <option value="VARIABLE">Variável</option>
                <option value="FIXED">Fixo</option>
              </select>
            </div>
          </div>
        }
      </div>
    }
  </div>

  <div class="mt-6 flex justify-end border-t border-border pt-4">
    <app-button type="button" (buttonClick)="close(true)" impact="bold" tone="primary" shape="rounded" size="medium">
      Concluir
    </app-button>
  </div>
</div>
