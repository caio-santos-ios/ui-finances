<div class="border-muted/20 bg-card w-[480px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-key text-primary text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">Alterar Senha</h2>
    </div>
    <button type="button" (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors cursor-pointer">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="text-foreground mb-1.5 block text-xs font-semibold" for="currentPassword">
        Senha Atual
      </label>
      <div class="relative">
        <input [type]="showCurrentPassword ? 'text' : 'password'" id="currentPassword" formControlName="currentPassword"
          placeholder="Digite sua senha atual"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-xs outline-hidden pr-9" />
        <button type="button" (click)="showCurrentPassword = !showCurrentPassword"
          class="text-muted-foreground hover:text-foreground absolute right-2.5 top-1/2 -translate-y-1/2 text-xs cursor-pointer">
          <i class="fa-solid" [ngClass]="showCurrentPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
      </div>
    </div>

    <div>
      <label class="text-foreground mb-1.5 block text-xs font-semibold" for="newPassword">
        Nova Senha
      </label>
      <div class="relative">
        <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" formControlName="newPassword"
          placeholder="Mínimo 6 caracteres"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-xs outline-hidden pr-9" />
        <button type="button" (click)="showNewPassword = !showNewPassword"
          class="text-muted-foreground hover:text-foreground absolute right-2.5 top-1/2 -translate-y-1/2 text-xs cursor-pointer">
          <i class="fa-solid" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
      </div>
    </div>

    <div>
      <label class="text-foreground mb-1.5 block text-xs font-semibold" for="confirmPassword">
        Confirmar Nova Senha
      </label>
      <div class="relative">
        <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword"
          placeholder="Repita a nova senha"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-xs outline-hidden pr-9" />
        <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
          class="text-muted-foreground hover:text-foreground absolute right-2.5 top-1/2 -translate-y-1/2 text-xs cursor-pointer">
          <i class="fa-solid" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-2 pt-2">
      <app-button (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>

      <app-button [disabled]="submitted" [isLoading]="submitted" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Salvar Senha
      </app-button>
    </div>
  </form>
</div>
