<div class="border-muted/20 bg-card w-[480px] max-w-[95vw] rounded-xl border p-6 shadow-xl">
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-money-check-dollar text-emerald-500 text-base"></i>
      <h2 class="text-foreground text-lg font-semibold">Pagar Fatura &bull; {{ invoice.label }}</h2>
    </div>
    <button type="button" (click)="close()"
      class="text-muted-foreground hover:bg-muted hover:text-foreground flex h-8 w-8 items-center justify-center rounded-lg transition-colors">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="mb-4 rounded-lg bg-background border border-muted/20 p-3 flex justify-between items-center text-xs">
    <div>
      <span class="text-muted-foreground block">Cartão</span>
      <span class="font-bold text-foreground text-sm">{{ card.name }}</span>
    </div>
    <div class="text-right">
      <span class="text-muted-foreground block">Total da Fatura</span>
      <span class="font-bold text-emerald-500 text-sm">{{ invoice.totalAmount | moneyPipe }}</span>
    </div>
  </div>

  <form [formGroup]="form">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-12">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="pay-bank">Conta Bancária de Débito *</label>
        <select id="pay-bank" formControlName="paymentBankId"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition">
          <option value="">Selecione a conta</option>
          @for (bank of banks; track bank.id) {
            <option [value]="bank.id">{{ bank.name }}</option>
          }
        </select>
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="pay-val">Valor Pago *</label>
        <input id="pay-val" type="text" placeholder="R$ 0,00" formControlName="value"
          mask="separator.2" thousandSeparator="." decimalMarker="," prefix="R$ "
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition font-semibold" />
      </div>

      <div class="col-span-12 sm:col-span-6">
        <label class="text-foreground mb-1.5 block text-xs font-semibold" for="pay-date">Data do Pagamento *</label>
        <input id="pay-date" type="date" formControlName="paidAt"
          class="border-muted/20 bg-background text-foreground focus:border-primary focus:ring-primary w-full rounded-lg border px-3 py-2 text-sm outline-none transition" />
      </div>
    </div>

    <div class="mt-4 rounded-lg border border-emerald-500/20 bg-emerald-500/5 px-3 py-2 text-[11px] text-muted-foreground">
      <i class="fa-solid fa-circle-info text-emerald-500 mr-1"></i>
      Ao confirmar, a fatura será marcada como <strong>Paga</strong>, o limite será liberado no cartão e uma despesa será lançada na conta escolhida.
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <app-button type="button" (buttonClick)="close()" impact="bold" tone="light" shape="rounded" size="medium">
        <i class="fa-solid fa-xmark mr-1.5"></i> Cancelar
      </app-button>
      <app-button (buttonClick)="confirmPay()" [isLoading]="isLoading" impact="bold" tone="primary" shape="rounded" size="medium">
        <i class="fa-solid fa-check mr-1.5"></i> Confirmar Pagamento
      </app-button>
    </div>
  </form>
</div>
